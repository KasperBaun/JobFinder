name: Build installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installers
  cancel-in-progress: true

env:
  VERSION: 0.6.${{ github.run_number }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove stale assets from "latest" prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release view latest --json assets --jq '.assets[].name' | while read -r name; do
              echo "Deleting asset: $name"
              gh release delete-asset latest "$name" -y
            done
          else
            echo "No existing 'latest' release; nothing to clean."
          fi

  build-windows:
    needs: cleanup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        # >= 22.12 — Electron 43 refuses older runtimes.
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test
        run: dotnet test src/Jobmatch.slnx -c Release
        env:
          # The runner has no git user.email; give UserContext.Resolve() a value so any
          # test that touches per-user paths resolves instead of throwing.
          JOBFINDER_USER: ci@jobfinder.local

      - name: Install workspaces
        run: npm ci

      - name: Test frontend
        run: |
          npm run lint -w jobfinder-gui
          npm run test -w jobfinder-gui

      - name: Publish backend (self-contained win-x64, GUI bundled)
        run: node src/scripts/publish-backend.mjs

      - name: Set desktop version
        run: npm version ${{ env.VERSION }} -w jobfinder-desktop --no-git-tag-version --allow-same-version

      - name: Build desktop installer (Electron / NSIS)
        run: npm run dist -w jobfinder-desktop

      - name: Publish to rolling "latest" prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Jobfinder (latest)
          prerelease: true
          files: src/desktop/release/jobfinder-setup-${{ env.VERSION }}.exe
          body: |
            Automated build from the latest commit on `main`
            (version `${{ env.VERSION }}`, commit ${{ github.sha }}).

            - **Windows** — download `jobfinder-setup-${{ env.VERSION }}.exe` and run it.
              SmartScreen may warn that the publisher is unknown (the installer is
              unsigned) — choose **More info → Run anyway**.
            - **Linux (Debian/Ubuntu)** — download `jobfinder-desktop_${{ env.VERSION }}_amd64.deb`
              and install with `sudo apt install ./jobfinder-desktop_${{ env.VERSION }}_amd64.deb`.

  build-linux:
    needs: cleanup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        # >= 22.12 — Electron 43 refuses older runtimes.
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test
        run: dotnet test src/Jobmatch.slnx -c Release
        env:
          JOBFINDER_USER: ci@jobfinder.local

      - name: Install workspaces
        run: npm ci

      - name: Test frontend
        run: |
          npm run lint -w jobfinder-gui
          npm run test -w jobfinder-gui

      - name: Publish backend (self-contained linux-x64, GUI bundled)
        run: node src/scripts/publish-backend.mjs linux-x64

      - name: Set desktop version
        run: npm version ${{ env.VERSION }} -w jobfinder-desktop --no-git-tag-version --allow-same-version

      - name: Build desktop installer (Electron / deb)
        run: npm run dist -w jobfinder-desktop

      - name: Append .deb to "latest" prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          prerelease: true
          files: src/desktop/release/jobfinder-desktop_${{ env.VERSION }}_amd64.deb
